# EventFlow Engine — local infrastructure
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f
#
# App services:
#   API (Octane/FrankenPHP) -> localhost:8000  (docker compose up -d api)
#   PostgreSQL  -> localhost:5432  (eventflow / eventflow / eventflow)
#   Redis       -> localhost:6379
#   RabbitMQ    -> AMQP :5672  |  UI http://localhost:15672  (eventflow / eventflow)
#   Workers     -> relay-outbox + consume-leads (phase2)
#
# Observability:
#   Prometheus  -> http://localhost:9090
#   Grafana     -> http://localhost:3000  (admin / admin)
#   Loki        -> http://localhost:3100
#   Jaeger UI   -> http://localhost:16686
#
# Scrape target: Prometheus pulls http://host.docker.internal:8000/api/metrics
# (run `php artisan serve` on the host). See observability/README.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
    ports:
      - "5432:5432"
    volumes:
      - eventflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d eventflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eventflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eventflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eventflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: eventflow
      RABBITMQ_DEFAULT_PASS: eventflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - eventflow_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: eventflow-prometheus
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        TOKEN="$${EVENTFLOW_METRICS_TOKEN:-change-me-metrics-token}"
        sed "s|__METRICS_TOKEN__|$${TOKEN}|g" /etc/prometheus/prometheus.yml.tpl > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-remote-write-receiver
    environment:
      EVENTFLOW_METRICS_TOKEN: ${EVENTFLOW_METRICS_TOKEN:-change-me-metrics-token}
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
      - eventflow_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: eventflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - eventflow_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.1
    container_name: eventflow-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - eventflow_loki_data:/loki

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: eventflow-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # Octane API (FrankenPHP) — multi-worker HTTP for realistic k6 load
  api:
    build:
      context: ./docker/frankenphp
    container_name: eventflow-api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      OCTANE_SERVER: frankenphp
      EVENTFLOW_MODE: ${EVENTFLOW_MODE:-phase2}
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_DATABASE: eventflow
      DB_USERNAME: eventflow
      DB_PASSWORD: eventflow
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: eventflow
      RABBITMQ_PASSWORD: eventflow
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: leads.incoming
      RABBITMQ_RETRY_QUEUE: leads.incoming.retry
      RABBITMQ_DLQ: leads.incoming.dlq
      RABBITMQ_EXPORTS_QUEUE: exports.requested
      RABBITMQ_EXPORTS_RETRY_QUEUE: exports.requested.retry
      RABBITMQ_EXPORTS_RETRY_TTL_MS: "3000"
      EVENTFLOW_ENRICHMENT_BASE_URL: http://host.docker.internal:8091
      EVENTFLOW_WEBHOOK_URL: http://host.docker.internal:8090/webhook
      EVENTFLOW_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      EVENTFLOW_TRACING_ENABLED: "true"
      EVENTFLOW_METRICS_TOKEN: ${EVENTFLOW_METRICS_TOKEN:-change-me-metrics-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command:
      [
        "php",
        "artisan",
        "octane:frankenphp",
        "--host=0.0.0.0",
        "--port=8000",
        "--workers=8",
        "--max-requests=1000",
      ]

  # PHP 64-bit workers (host PHP is often 32-bit and breaks php-amqplib)
  relay-outbox:
    build:
      context: ./docker/php
    container_name: eventflow-relay
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &worker-env
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      EVENTFLOW_MODE: phase2
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_DATABASE: eventflow
      DB_USERNAME: eventflow
      DB_PASSWORD: eventflow
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: eventflow
      RABBITMQ_PASSWORD: eventflow
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: leads.incoming
      RABBITMQ_RETRY_QUEUE: leads.incoming.retry
      RABBITMQ_DLQ: leads.incoming.dlq
      RABBITMQ_EXPORTS_QUEUE: exports.requested
      RABBITMQ_EXPORTS_RETRY_QUEUE: exports.requested.retry
      RABBITMQ_EXPORTS_RETRY_TTL_MS: "3000"
      EVENTFLOW_ENRICHMENT_BASE_URL: http://host.docker.internal:8091
      EVENTFLOW_WEBHOOK_URL: http://host.docker.internal:8090/webhook
      EVENTFLOW_OTLP_ENDPOINT: http://host.docker.internal:4318/v1/traces
      EVENTFLOW_TRACING_ENABLED: "true"
      EVENTFLOW_METRICS_TOKEN: ${EVENTFLOW_METRICS_TOKEN:-change-me-metrics-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["sh", "-c", "while true; do php artisan eventflow:relay-outbox; sleep 1; done"]

  consume-leads:
    build:
      context: ./docker/php
    container_name: eventflow-consume
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["php", "artisan", "eventflow:consume-leads"]

  # Fair CRM export worker (multi-tenant commercial_dossier load lab)
  process-exports:
    build:
      context: ./docker/php
    container_name: eventflow-exports
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["php", "artisan", "eventflow:process-exports", "--sleep=1"]

volumes:
  eventflow_postgres_data:
  eventflow_redis_data:
  eventflow_rabbitmq_data:
  eventflow_prometheus_data:
  eventflow_grafana_data:
  eventflow_loki_data:
